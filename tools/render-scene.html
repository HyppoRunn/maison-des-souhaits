<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<canvas id="c" width="2000" height="1200"></canvas>
<script>
const W=2000,H=1200,VPX=1000,VPY=380,FLOOR=830;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const L=document.createElement('canvas');L.width=W;L.height=H;const lx=L.getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(2026);const rr=(a,b)=>a+R()*(b-a);
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967295}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2;a*=.5}return s}
const g2=(x,y,cx,cy,sx,sy)=>Math.exp(-((x-cx)**2/(2*sx*sx)+(y-cy)**2/(2*sy*sy)));
const clamp=(v,a=0,b=255)=>v<a?a:v>b?b:v;

/* ===== 1. Wall + floor + rug, per pixel ===== */
(function base(){
 const img=ctx.createImageData(W,H),d=img.data;
 const plankOff=[];for(let i=-40;i<40;i++)plankOff[i+40]=hash(i,7)*25;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let r,g,b,amb=.2,tree,fire,win,spec=0;
  if(y<FLOOR){
   tree=.62*g2(x,y,1000,520,480,400);fire=.7*g2(x,y,1700,740,280,240);win=.3*g2(x,y,310,330,230,260);
   const n=fbm(x*.012,y*.012,5);const fine=vn(x*.25,y*.25);
   if(y<548){r=150;g=124;b=98;const k=.86+.22*n+.05*fine;r*=k;g*=k;b*=k;
     if(y<34){r=170;g=150;b=125;if(y>26)r*=.6,g*=.6,b*=.6}}
   else if(y<566){r=78;g=96;b=84;const k=y<552?1.35:y>561?.55:1;r*=k;g*=k;b*=k}
   else if(y<800){r=40;g=62;b=52;const k=.92+.12*n;r*=k;g*=k;b*=k;
     const pw=250,px=((x-30)%pw+pw)%pw,py=y-566,ins=26;
     if(px<ins||px>pw-ins||py<ins||py>234-ins){}
     else{const e=Math.min(px-ins,pw-ins-px,py-ins,234-ins-py);if(e<6){const lit=(px-ins<6||py-ins<6);const f=lit?1.35:.6;r*=f;g*=f;b*=f}}}
   else{r=70;g=90;b=80;const k=y<806?1.4:y>826?.5:1;r*=k;g*=k;b*=k}
  }else{
   const dy=y-VPY,wx=(x-VPX)/dy*600,wz=60000/dy;
   tree=.8*g2(x,y,1000,930,560,200);fire=.75*g2(x,y,1700,880,330,140);win=.15*g2(x,y,330,900,250,200);
   spec=.3*g2(x,y,1000,900,170,300)+.35*g2(x,y,1700,900,110,240);
   const inRug=Math.abs(wx)<740&&wz>76&&wz<113;
   if(inRug){
     const u=740-Math.abs(wx),v=Math.min(wz-76,113-wz)*22;const e=Math.min(u,v);
     const fab=.85+.25*vn(x*.9,y*.9)+.1*fbm(wx*.05,wz*.8,2);
     if(e<14){r=40;g=40;b=70}else if(e<70){r=170;g=145;b=105;if(Math.sin(wx*.07)*Math.sin(wz*1.4)>.55){r=110;g=30;b=30}}
     else if(e<90){r=30;g=38;b=72}
     else{r=112;g=24;b=26;const a1=Math.abs(((wx*.012+wz*.45)%1+1)%1-.5),a2=Math.abs(((wx*.012-wz*.45)%1+1)%1-.5);
       if(Math.abs(a1-.25)<.02||Math.abs(a2-.25)<.02){r=150;g=112;b=58}
       const ro=Math.hypot(a1,a2);if(ro<.09){r=28;g=36;b=66}if(ro<.04){r=160;g=128;b=80}
       const md=Math.hypot(wx/420,(wz-94.5)/9);if(md<1&&md>.93){r=150;g=112;b=58}else if(md<.93){r=r*.8+20*.2;g=g*.8+30*.2;b=b*.8+60*.2;if(md<.25){r=160;g=128;b=80}}}
     r*=fab;g*=fab;b*=fab;spec*=.15;
   }else{
     const pi=Math.floor(wx/110),fu=wx/110-pi,po=plankOff[(pi%40+40)%40+0]||0,seg=Math.floor((wz+po)/26),fv=((wz+po)/26)-seg;
     const tint=.85+.3*hash(pi,seg);const grain=.75+.35*fbm(wx*.35+pi*17,wz*.05,4)+.08*Math.sin(wx*1.3+fbm(wx*.1,wz*.1)*8);
     r=126*tint*grain;g=82*tint*grain;b=46*tint*grain;
     if(fu<.012||fu>.988||fv<.006){r*=.35;g*=.35;b*=.35}
   }
   const depthDark=.75+.25*Math.min(1,(y-FLOOR)/200);amb*=depthDark;
  }
  const lr=amb*.8+tree*1.0+fire*1.0+win*.5,lg=amb*.78+tree*.72+fire*.52+win*.62,lb=amb*.85+tree*.45+fire*.25+win*.9;
  const i=(y*W+x)*4;d[i]=clamp(r*lr*1.5+spec*255*.55);d[i+1]=clamp(g*lg*1.5+spec*255*.38);d[i+2]=clamp(b*lb*1.5+spec*255*.2);d[i+3]=255;
 }
 ctx.putImageData(img,0,0);
})();

/* helpers */
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.35,`rgba(${col},${a*.35})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function needle(path,x,y,a,l){path.moveTo(x,y);path.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l)}
const noiseC=document.createElement('canvas');noiseC.width=noiseC.height=256;(()=>{const c=noiseC.getContext('2d'),im=c.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=R()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}c.putImageData(im,0,0)})();

   ctx.fillStyle='rgba(220,232,255,.55)';ctx.beginPath();ctx.moveTo(tx,yy+2);ctx.lineTo(tx+ww*.6,yy+th/6);ctx.lineTo(tx-ww*.2,yy+th/6);ctx.fill()}}
 g=ctx.createLinearGradient(0,450,0,gy+gh);g.addColorStop(0,'#9eb0cf');g.addColorStop(1,'#d6e0f2');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(gx,468);for(let x=gx;x<=gx+gw;x+=8)ctx.lineTo(x,462+Math.sin(x*.035)*8);ctx.lineTo(gx+gw,gy+gh);ctx.lineTo(gx,gy+gh);ctx.fill();

 g=ctx.createLinearGradient(gx,gy,gx+gw,gy+gh);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.45,'rgba(255,255,255,.07)');g.addColorStop(.5,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(gx,gy,gw,gh);

 ctx.restore();
 const wood=(x,y,w,h,lit)=>{const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,lit?'#7a5236':'#4a2f1d');g.addColorStop(1,'#2e1b10');ctx.fillStyle=g;ctx.fillRect(x,y,w,h)};
 wood(150,120,320,22,1);wood(150,518,320,24,0);wood(150,120,22,420,1);wood(448,120,22,420,0);wood(304,142,12,376,1);wood(172,324,276,12,1);
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(172,142,276,6);ctx.fillRect(172,142,6,376);
 let g2_=ctx.createLinearGradient(0,540,0,566);g2_.addColorStop(0,'#8a6a4c');g2_.addColorStop(1,'#3a2618');ctx.fillStyle=g2_;ctx.fillRect(130,540,360,22);
 // lantern on sill
 ctx.fillStyle='#1c140e';ctx.fillRect(380,470,44,72);ctx.fillStyle='rgba(255,200,120,.25)';ctx.fillRect(386,482,32,54);glow(lx,402,508,60,'255,190,110',.7);glow(lx,402,512,10,'255,240,200',1);
 // curtains
 function curtain(x0,x1,seed){for(let x=x0;x<x1;x++){const t=(x-x0)/(x1-x0);const f=Math.sin(t*Math.PI*7+seed)*.5+.5,f2=Math.sin(t*Math.PI*19+seed*2)*.5+.5;
   const lit=.35+.55*f+.12*f2;const warm=x>800?1:Math.max(0,1-Math.abs(x-300)/700);
   const g=ctx.createLinearGradient(0,70,0,820);g.addColorStop(0,`rgb(${60*lit|0},${12*lit|0},${18*lit|0})`);g.addColorStop(.5,`rgb(${120*lit*(.8+.3*warm)|0},${26*lit|0},${32*lit|0})`);g.addColorStop(1,`rgb(${70*lit|0},${14*lit|0},${18*lit|0})`);
   ctx.fillStyle=g;ctx.fillRect(x,78,1.4,745+Math.sin(x*.3)*4)}}

 for(const x of [48,572]){ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,74,13,0,7);ctx.fill()}

 ctx.fillStyle='#2a2222';ctx.fillRect(x+60,y+120,56,40);ctx.beginPath();ctx.moveTo(x+52,y+122);ctx.lineTo(x+88,y+92);ctx.lineTo(x+124,y+122);ctx.fill();ctx.fillStyle='#ffcc77';ctx.fillRect(x+76,y+132,10,10);

/* ===== 4. Fireplace ===== */
(function fireplace(){

 for(let y=y0,row=0;y<y1;y+=24,row++){for(let x=x0-(row%2?32:0);x<x1;x+=64){

 ctx.fillStyle='rgba(30,20,15,.6)';for(let y=y0;y<y1;y+=24)ctx.fillRect(x0,y+22,x1-x0,2);

 ctx.save();ctx.clip();for(let y=560;y<y1;y+=18)for(let x=ox0-20;x<ox1;x+=44){ctx.strokeStyle=`rgba(255,120,40,${.08*g2(x,y,1700,800,90,80)*6})`;ctx.strokeRect(x+((y/18|0)%2?22:0),y,44,18)}ctx.restore();
 ctx.strokeStyle='#2a1810';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(ox0,y1);ctx.lineTo(ox0,oy);ctx.arc(1700,oy,95,Math.PI,0);ctx.lineTo(ox1,y1);ctx.stroke();

/* ===== 5. Wreath, stockings, mantel garland, candles ===== */
function greenery(points,lenA,lenB,density,lumBase){const buckets={};
 for(const [x,y,a] of points)for(let k=0;k<density;k++){const ang=a+rr(-1.6,1.6),l=rr(lenA,lenB),L_=clamp(lumBase+rr(-6,10),3,40)|0;

(function wreath(){const cx=1700,cy=290;const pts=[];for(let i=0;i<900;i++){const a=rr(0,7),r0=rr(70,125);pts.push([cx+Math.cos(a)*r0,cy+Math.sin(a)*r0,a+Math.PI/2])}
